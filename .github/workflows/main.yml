name: Hyd Jobs Bot 

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install requests beautifulsoup4 lxml --quiet

      - name: Run Hyd Jobs Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          YOUR_GMAIL: ${{ secrets.YOUR_GMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
        run: |
          python main.py || echo "Bot finished"

      - name: Save posted jobs history
        run: |
          git config --global user.name "HydHireHub Bot"
          git config --global user.email "bot@hydhirehub.com"
          if [ -f posted.json ]; then
            git add posted.json
            git commit -m "Update Hyd jobs - $(date)" || echo "No changes"
            git push || echo "Push done"
          else
            echo "No posted.json yet"
          fi
