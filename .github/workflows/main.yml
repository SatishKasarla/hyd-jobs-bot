name: Job Bot Auto Poster

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Requirements
        run: pip install -r requirements.txt

      - name: Run Job Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          YOUR_GMAIL: ${{ secrets.YOUR_GMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
        run: python main.py

      - name: Save Posted Jobs History
        run: |
          git config --global user.name "JobBot"
          git config --global user.email "bot@github.com"
          git add posted.json || echo "No file"
          git diff --staged --quiet || git commit -m "Update posted jobs"
          git push || echo "No changes to push"
