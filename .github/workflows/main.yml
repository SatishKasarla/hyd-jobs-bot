name: Hyd Hire Hub Auto Jobs
on:
  schedule:
    - cron: '0 3,9 * * *' # Roju 2 sarlu: Morning 8:30 IST & Afternoon 2:30 IST
  workflow_dispatch: # Manual ga test cheyadaniki button

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python fetch_jobs.py
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
      - name: Save posted jobs
        run: |
          git config user.name "Auto Bot"
          git config user.email "bot@hydhirehub.com"
          git add posted.json
          git commit -m "Updated posted jobs" || echo "No changes"
          git push
